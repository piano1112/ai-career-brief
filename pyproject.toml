[project]
name = "ai-career-brief"
version = "0.1.0"
description = "개인용 AI 커리어 브리핑 앱"
requires-python = ">=3.12"
# 의존성은 requirements.txt / requirements-dev.txt에서 관리한다.

[tool.ruff]
line-length = 100
target-version = "py312"
# Alembic이 자동 생성하는 파일은 lint/format 대상에서 제외
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
